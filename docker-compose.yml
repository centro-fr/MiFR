services:
  db:
    image: postgres:16-alpine
    container_name: mifr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mifr
    # Solo en la propia máquina: el usuario y la contraseña están en el repositorio y son de superusuario.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mifr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mifr"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de los tests de integración (pnpm --filter back test:integration). Es descartable: vive
  # en memoria y solo se levanta con el perfil, así un `docker compose up` normal no la arranca.
  #   docker compose --profile test up -d db-test
  db-test:
    image: postgres:16-alpine
    container_name: mifr-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mifr_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mifr_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: produccion
    container_name: mifr-api
    restart: unless-stopped
    # Igual que en Render: al arrancar aplica las migraciones pendientes y después levanta la API.
    # GOOGLE_CLIENT_ID, JWT_SECRET, JWT_EXPIRES_IN y NODE_ENV salen de back/.env; lo de abajo tiene
    # prioridad. Sin NODE_ENV en back/.env la imagen corre en production, como en Render.
    env_file:
      - back/.env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mifr?schema=public
      PORT: 3000
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://localhost:3001}
      # El navegador llega por el puerto publicado o por el proxy de Vite, que no agrega X-Forwarded-For.
      PROXIES_DE_CONFIANZA: ${PROXIES_DE_CONFIANZA:-0}
    # Con back/.env de desarrollo la API trae el login sin Google: se publica solo en la propia
    # máquina, no en la red local. Adentro del contenedor escucha en todas las interfaces (HOST del Dockerfile).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Perfil "completo": el sistema entero en contenedores, como se publica (base, API y front servido
  # como en Netlify), con los datos de prueba. Para probar todo junto antes de desplegar:
  #   docker compose --profile completo up -d --build
  #   pnpm probar:compose
  # Sin el perfil, `docker compose up` sigue levantando solo la base y la API para desarrollar.

  # Carga los datos de prueba (roles, permisos, actividades, alumnos de demo) y termina. Corre con la
  # etapa de build de la imagen de la API, que tiene tsx y las dependencias de desarrollo. Volver a
  # correrlo no duplica nada.
  datos-demo:
    profiles: ["completo"]
    build:
      context: .
      dockerfile: back/Dockerfile
      target: build
    container_name: mifr-datos-demo
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mifr?schema=public
    command: ["pnpm", "--filter", "back", "db:seed:demo"]
    restart: "no"
    # Después de la API, que es quien aplica las migraciones al arrancar.
    depends_on:
      api:
        condition: service_healthy

  front:
    profiles: ["completo"]
    build:
      context: .
      dockerfile: front/Dockerfile
      # Vite las incrusta al compilar: cambiarlas requiere --build. El login de desarrollo necesita
      # LOGIN_DESARROLLO=true en back/.env.
      args:
        VITE_LOGIN_DESARROLLO: ${VITE_LOGIN_DESARROLLO:-true}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SITIO_URL: http://localhost:8080
    container_name: mifr-front
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mifr-db-data:
