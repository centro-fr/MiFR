<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO de la página pública: es lo que leen los buscadores y las vistas previas de un enlace
       (WhatsApp, Instagram), que no ejecutan JavaScript. Las páginas del sistema cambian el título
       al cargar y se piden fuera del índice. VITE_SITIO_URL arma las URLs absolutas. -->
  <title>Centro de Entrenamiento FR · Gimnasio en Perico, Jujuy</title>
  <meta name="description"
    content="Funcional, HIIT, acondicionamiento, Power, Combat y más en Perico, Jujuy. Clases de lunes a viernes con profes que te siguen de cerca. Escribinos y empezá esta semana." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:site_name" content="Centro de Entrenamiento FR" />
  <meta property="og:title" content="Centro de Entrenamiento FR · Entrená con energía" />
  <meta property="og:description"
    content="Funcional, HIIT, acondicionamiento y más en Perico, Jujuy. Escribinos y empezá esta semana." />
  <meta property="og:url" content="%VITE_SITIO_URL%/" />
  <meta property="og:image" content="%VITE_SITIO_URL%/og-portada.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Entrená con energía: Centro de Entrenamiento FR" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Aplica el tema guardado antes del primer pintado para que el splash
       respete el tema claro/oscuro desde el inicio (misma clave que theme-store). -->
  <!-- Color de la barra del navegador en mobile; theme-store lo actualiza al cambiar de tema. -->
  <meta name="theme-color" content="#f8fafc" />
  <script>
    try {
      if (localStorage.getItem("mifr:tema") === "oscuro") {
        document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f131d");
      }
    } catch (e) { /* sin almacenamiento: tema claro por defecto */ }
  </script>
  <!-- Google Fonts: Plus Jakarta Sans (solo pesos usados) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="min-h-full font-sans antialiased text-dark bg-bg-light dark:bg-canvas dark:text-slate-100">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
