<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiFR | Centro de Entrenamiento</title>
  <!-- Aplica el tema guardado antes del primer pintado para que el splash
       respete el tema claro/oscuro desde el inicio (misma clave que theme-store). -->
  <script>
    try {
      if (localStorage.getItem("mifr:tema") === "oscuro") document.documentElement.classList.add("dark");
    } catch (e) { /* sin almacenamiento: tema claro por defecto */ }
  </script>
  <!-- Google Fonts: Plus Jakarta Sans (solo pesos usados) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="min-h-full font-sans antialiased text-dark bg-bg-light dark:bg-canvas dark:text-slate-100">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
