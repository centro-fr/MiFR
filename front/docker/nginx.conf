# Servidor del front en docker compose: hace lo mismo que Netlify en producción (netlify.toml).
# Las cabeceras tienen que ser idénticas a las de netlify.toml; src/test/cabeceras-del-sitio.test.ts
# falla si se desalinean.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # A nivel de server y sin add_header en los location: nginx no hereda las cabeceras de arriba en un
  # location que define las suyas.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.googleusercontent.com https://cdn.jsdelivr.net https://raw.githubusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

  # El navegador solo habla con este servidor (mismo origen) y /api se reenvía a la API, como hace la
  # regla de /api/* de netlify.toml.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los archivos con hash de Vite no cambian nunca: el navegador los puede guardar un año.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # La SPA resuelve sus rutas en el navegador: cualquier ruta que no sea un archivo devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
