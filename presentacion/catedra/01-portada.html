<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 · Portada</title>
  <link rel="stylesheet" href="../recursos/tema.css">
  <link rel="stylesheet" href="../recursos/estilos.css">
  <script src="filminas.js" defer></script>
  <script src="../recursos/presentacion.js" defer></script>
</head>
<body>
  <main class="diapositiva diapositiva--intro">
    <div class="portada">
      <div class="portada__marca">
        <img class="logo animable" style="--orden: 0" src="../recursos/logo-fr.webp" alt="Logo de FR Centro de Entrenamiento" width="256" height="256">
        <h1 class="animable" style="--orden: 1">MiFR</h1>
        <p class="animable" style="--orden: 2">Gestión del Centro de Entrenamiento FR</p>
      </div>
      <div class="mockup-pc mockup-pc--portada animable" style="--orden: 3">
        <div class="barra-navegador" aria-hidden="true">
          <span class="boton-ventana boton-ventana--cerrar"></span>
          <span class="boton-ventana boton-ventana--minimizar"></span>
          <span class="boton-ventana boton-ventana--maximizar"></span>
        </div>
        <!-- Cuando esté la captura, reemplazar el marcador por:
             <img src="../recursos/capturas/mifr-pc.webp" alt="Panel de administración de MiFR en la computadora"> -->
        <div class="pantalla pantalla--captura">
          <div class="pantalla__pendiente">Captura de MiFR en la PC</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
