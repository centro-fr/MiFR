<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 · Un día en FR hoy</title>
  <link rel="stylesheet" href="../recursos/tema.css">
  <link rel="stylesheet" href="../recursos/estilos.css">
  <script src="filminas.js" defer></script>
  <script src="../recursos/presentacion.js" defer></script>
</head>
<body>
  <main class="diapositiva diapositiva--contenido">
    <div class="contenido contenido--centrado">
      <p class="subtitulo animable" style="--orden: 0">Hoy, a las 19:00</p>
      <h2 class="animable" style="--orden: 1">Un día en FR hoy</h2>
      <ul class="islas" aria-label="Dónde está hoy la información">
        <li class="isla animable" style="--orden: 2"><span class="isla__icono" aria-hidden="true">📓</span>Cuaderno de Flor</li>
        <li class="isla animable" style="--orden: 3"><span class="isla__icono" aria-hidden="true">📒</span>Cuaderno de cada profe</li>
        <li class="isla animable" style="--orden: 4"><span class="isla__icono" aria-hidden="true">🎫</span>Tarjeta de cartón</li>
        <li class="isla animable" style="--orden: 5"><span class="isla__icono" aria-hidden="true">💬</span>WhatsApp</li>
      </ul>
      <p class="mensaje-clave animable" style="--orden: 6">La información existe, pero está en <strong>4 lugares que no se hablan entre sí</strong>.</p>
    </div>
  </main>
