<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Lo que nos pediste</title>
  <link rel="stylesheet" href="../recursos/tema.css">
  <link rel="stylesheet" href="../recursos/estilos.css">
  <script src="filminas.js" defer></script>
  <script src="../recursos/presentacion.js" defer></script>
</head>
<body>
  <main class="diapositiva diapositiva--contenido">
    <div class="contenido contenido--centrado">
      <p class="subtitulo animable" style="--orden: 0">Lo que nos pediste</p>
      <blockquote class="cita animable" style="--orden: 1">
        <p>Si el sistema hiciera bien solo tres cosas: control de vencimiento, control de asistencia y planillas de pago.</p>
      </blockquote>
      <p class="subtitulo cita-titulo animable" style="--orden: 2" id="objetivo">Objetivo a 6 meses</p>
      <blockquote class="cita cita--secundaria animable" style="--orden: 3" aria-labelledby="objetivo">
        <p>Que no se atrasen con las cuotas y que no haya fuga de asistencias.</p>
      </blockquote>
    </div>
  </main>
