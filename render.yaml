# Blueprint de Render para publicar la API. Todavía no está en uso: ver docs/DESPLIEGUE.md.
# La base de datos no va acá: es de Neon, porque la base gratuita de Render se borra a los 30 días.
services:
  - name: mifr-api
    type: web
    runtime: docker
    plan: free
    # Misma región que la base de Neon (AWS us-east-1) para que cada consulta no cruce el continente.
    region: virginia
    dockerfilePath: ./back/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render pide estos valores al crear el Blueprint; no quedan escritos en el repositorio.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGENES
        sync: false
      # Proxies delante de la API (Netlify y el balanceador de Render). Se calibra después del primer
      # deploy: ver el paso 10 de docs/DESPLIEGUE.md.
      - key: PROXIES_DE_CONFIANZA
        sync: false
      # Secreto que comparte con Netlify para verificar que cada pedido pasó por el sitio. No se genera
      # acá porque Netlify necesita el mismo valor: ver el paso 3 de docs/DESPLIEGUE.md.
      - key: FIRMA_PROXY_NETLIFY
        sync: false
      # Claves VAPID de los avisos push: se generan juntas fuera de Render (paso 3 de docs/DESPLIEGUE.md).
      - key: VAPID_CLAVE_PUBLICA
        sync: false
      - key: VAPID_CLAVE_PRIVADA
        sync: false
      - key: VAPID_CONTACTO
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
